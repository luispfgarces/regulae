name: .NET build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v5.0.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - name: Setup .NET (for build)
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
        dotnet-quality: ga
    - name: Setup .NET (for test)
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        dotnet-quality: ga
    - name: Setup Report Generator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    - name: MongoDB in GitHub Actions
      uses: supercharge/mongodb-github-action@1.9.0
      with:
        mongodb-version: '4.4'
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build --verbosity normal -m:1 -c Release --collect:"XPlat Code Coverage" --results-directory:"../../coverage-outputs"
    - name: Merge coverage results
      run: |
        reportgenerator -reports:"../../coverage-outputs/**/*.xml" -targetdir:"../../coverage-outputs" -reporttypes:Cobertura
        rm -rfv ../../coverage-outputs/*/
        ls -la ../../coverage-outputs